[project]
name = "patriots-python-examples"
version = "0.1.0"
description = "python programming concepts through the 2004 new england patriots"
requires-python = ">=3.12"
dependencies = [
    "cowsay>=6.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "basic_python_concepts",
    "beginner_python_concepts",
]
python_files = ["basic_test_*.py", "test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
